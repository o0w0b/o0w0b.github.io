# 应用启动页配置
title: "o0w0b の 启动页"
showClock: true
showDate: true
showSearch: true
showSystemStatus: false

# 壁纸设置
wallpaper: "" # 留空使用默认背景，或填写图片URL

# 默认搜索引擎
defaultEngine: "google"

# 搜索引擎配置
searchEngines:
  google:
    name: "Google"
    url: "https://www.google.com/search?q= {query}"
    icon: "logos:google-icon"
  bing:
    name: "Bing"
    url: "https://www.bing.com/search?q= {query}"
    icon: "logos:bing"
  baidu:
    name: "百度"
    url: "https://www.baidu.com/s?wd= {query}"
    icon: "simple-icons:baidu"

# 应用分组
appGroups:
  - id: "website"
    name: "个人网站"
    icon: "mdi:account-circle"
    apps:
      - title: "主页"
        url: "https://site.o0w0b.top "
        icon: "mdi:home"
        color: "#6366f1"
        openInNew: true
        description: "蔚蓝档案风格主页"

      - title: "博客"
        url: "https://blog.o0w0b.top "
        icon: "mdi:pencil-outline"
        color: "#f59e0b"
        openInNew: true
        description: "技术文章、学习笔记与生活记录"

  - id: "work"
    name: "工作工具"
    icon: "mdi:briefcase"
    apps:
      - title: "GitHub"
        url: "https://github.com "
        icon: "mdi:github"
        color: "#24292e"
        openInNew: true
        description: "全球最大的代码托管平台，开源项目宝库"
      - title: "VS Code"
        url: "vscode://"
        icon: "mdi:microsoft-visual-studio-code"
        color: "#007acc"
        openInNew: false
        description: "本地代码编辑器，点击直接打开软件"

  - id: "entertainment"
    name: "娱乐休闲"
    icon: "mdi:gamepad-variant"
    apps:
      - title: "YouTube"
        url: "https://youtube.com "
        icon: "mdi:youtube"
        color: "#ff0000"
        openInNew: true
        description: "全球最大的视频分享平台"
      - title: "哔哩哔哩"
        url: "https://www.bilibili.com "
        icon: "simple-icons:bilibili"
        color: "#00a1d6"
        openInNew: true
        description: "国内领先的年轻人文化社区与视频平台"

  - id: "tools"
    name: "实用工具"
    icon: "mdi:tools"
    apps:
      - title: "CloudPaste"
        url: "https://share.o0w0b.top"
        icon: "mdi:clipboard-text"
        color: "#6366f1"
        description: "自托管在线剪贴板，支持 Markdown、文件分享"
        openInNew: true
